<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.3"/>
  
  <!-- Back Dice (Rotated) -->
  <g transform="translate(290, 140) rotate(18)">
    <rect x="0" y="0" width="160" height="160" rx="32" fill="url(#diceGrad)" filter="url(#shadow)"/>
    <text x="80" y="112" font-family="-apple-system, Outfit, sans-serif" font-size="90" font-weight="900" fill="#ef4444" text-anchor="middle">A</text>
  </g>

  <!-- Front Dice -->
  <g transform="translate(100, 170) rotate(-12)">
    <rect x="0" y="0" width="190" height="190" rx="38" fill="url(#diceGrad)" filter="url(#shadow)"/>
    <rect x="8" y="8" width="174" height="174" rx="30" fill="none" stroke="#e2e8f0" stroke-width="3"/>
    
    <!-- Ace Spades Symbol -->
    <text x="95" y="135" font-family="-apple-system, Outfit, sans-serif" font-size="110" font-weight="900" fill="#1e293b" text-anchor="middle">♠</text>
  </g>

  <!-- Stars / Accent Sparkles -->
  <circle cx="390" cy="110" r="8" fill="#fbbf24"/>
  <circle cx="110" cy="400" r="6" fill="#3b82f6"/>
  <path d="M 410 380 L 415 395 L 430 400 L 415 405 L 410 420 L 405 405 L 390 400 L 405 395 Z" fill="#fbbf24"/>
</svg>
